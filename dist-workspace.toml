[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "oberbichler/homebrew-tap"
# Publish jobs to run in CI. dist only knows the command line tool; the
# desktop app (app/, its own workspace) is built and published by our own
# reusable workflows: the disk image goes into the same GitHub release, and
# the cask into the same tap. The cask is committed after the announcement,
# so that it does not race dist's formula commit to the tap.
publish-jobs = ["homebrew"]
global-artifacts-jobs = ["./build-app"]
post-announce-jobs = ["./publish-app"]
# Target platforms to build apps for (Rust target-triple syntax). dino-copy is
# Unix-only (main.rs refuses to compile elsewhere), so macOS and Linux, no Windows.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
# Which actions to run on pull requests
pr-run-mode = "plan"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

# GitHub retired the macos-14 arm64 image that dist 0.32 picks by default.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
