# The command line tool lives in the root package; the mirror engine is the
# `core` library. The desktop app (`app/`) is deliberately its own workspace
# with its own lockfile, so its dependencies never touch the CLI's.
[workspace]
members = [".", "core"]
exclude = ["app"]

[package]
name = "dino-copy"
version = "0.2.1"
edition = "2024"
# Kept under 80 characters and without a trailing full stop: dist copies this
# verbatim into the Homebrew formula's `desc`, which `brew audit` checks.
description = "Fast one-way directory mirror for local disks"
license = "ISC"
repository = "https://github.com/oberbichler/dino-copy"
homepage = "https://github.com/oberbichler/dino-copy"
readme = "README.md"
keywords = ["sync", "mirror", "backup", "copy", "cli"]
categories = ["command-line-utilities", "filesystem"]
rust-version = "1.85"

[dependencies]
dino-copy-core = { path = "core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.18"
anyhow = "1"
# termination: additionally catches SIGTERM and SIGHUP. Without the feature,
# temp files are left behind in the target on a cron timeout or at logout.
ctrlc = { version = "3", features = ["termination"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

[[bin]]
name = "dino-copy"
path = "src/main.rs"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
