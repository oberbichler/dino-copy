name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the case/normalization aliasing tests (APFS is
        # case-insensitive); Linux runs the permission-based tests as non-root.
        os: [ubuntu-latest, macos-latest]
        # stable plus the minimum supported version from Cargo.toml.
        toolchain: [stable, "1.85"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # --workspace: the engine (core/) has most of the tests.
      - run: cargo test --workspace --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo doc --workspace --locked --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  # The desktop app: its own workspace and lockfile (app/src-tauri), macOS only.
  app:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci
      - run: npm run typecheck
      # Builds the frontend into dist/, which the Rust build embeds and the UI
      # tests serve.
      - run: npm run build
      - run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app/src-tauri
      - run: cargo test --locked
        working-directory: app/src-tauri
      - run: npx playwright install webkit
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-report
          path: app/playwright-report

  # The disk image and the cask exactly as a release builds them.
  app-bundle:
    uses: ./.github/workflows/build-app.yml
