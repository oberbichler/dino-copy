# Builds DinoCopy.app for Apple Silicon and Intel and packs it into
# DinoCopy.dmg, uploaded as the artifact "artifacts-build-app".
#
# release.yml (generated by dist, see dist-workspace.toml) calls this with
# dist's plan; the host job then attaches the disk image to the GitHub release.
# ci.yml calls it without a plan to check that the app still builds.
#
# There is no Apple Developer ID: the app is signed ad hoc and not notarized.
name: Build app

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan of the release; empty for a check build
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-app:
    runs-on: macos-15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: npm ci

      # The app and the command line tool share one version and one tag.
      - name: Check the version against the tag
        if: inputs.plan != ''
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          tag=$(jq -r .announcement_tag <<<"$PLAN")
          app=$(cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml \
            | jq -r '.packages[] | select(.name == "dino-copy-app") | .version')
          if [ "v$app" != "$tag" ]; then
            echo "::error::app version $app does not match the tag $tag"
            exit 1
          fi

      - run: npx tauri build --ci --target universal-apple-darwin --bundles dmg

      - name: Collect the disk image
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/DinoCopy_*_universal.dmg "$RUNNER_TEMP/out/DinoCopy.dmg"
          cd "$RUNNER_TEMP/out"
          shasum -a 256 DinoCopy.dmg > DinoCopy.dmg.sha256
          cat DinoCopy.dmg.sha256

      # Mount the image and check what a user would get.
      - name: Check the app in the image
        run: |
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$RUNNER_TEMP/out/DinoCopy.dmg"
          app="$mnt/DinoCopy.app"
          lipo -archs "$app/Contents/MacOS/dino-copy-app" | tee /dev/stderr | grep -q 'x86_64 arm64'
          codesign --verify --deep --strict "$app"
          plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-app
          path: |
            ${{ runner.temp }}/out/DinoCopy.dmg
            ${{ runner.temp }}/out/DinoCopy.dmg.sha256
