# Writes the DinoCopy cask (app/packaging/cask.sh) to oberbichler/homebrew-tap
# once the GitHub release with DinoCopy.dmg exists.
#
# Called by release.yml (generated by dist, see dist-workspace.toml) after the
# host job, next to dist's own formula job; uses the same HOMEBREW_TAP_TOKEN.
name: Publish app

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan of the release
        type: string
        required: true

permissions:
  contents: read

jobs:
  publish-cask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: dino-copy
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-build-app
          path: app
      - uses: actions/checkout@v6
        with:
          repository: oberbichler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the cask
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          version=$(jq -r .announcement_tag <<<"$PLAN")
          version=${version#v}
          sha256=$(cut -d' ' -f1 app/DinoCopy.dmg.sha256)
          (cd app && shasum -a 256 -c DinoCopy.dmg.sha256)

          mkdir -p tap/Casks
          dino-copy/app/packaging/cask.sh "$version" "$sha256" > tap/Casks/dinocopy.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dinocopy.rb
          git commit -m "dinocopy $version"
          git push
