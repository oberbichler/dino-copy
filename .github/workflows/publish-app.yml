# Commits the DinoCopy cask that build-app.yml wrote for this release to
# oberbichler/homebrew-tap.
#
# Called by release.yml (generated by dist, see dist-workspace.toml) after the
# release is announced, so after dist's formula commit; uses the same
# HOMEBREW_TAP_TOKEN.
# It needs no permissions on this repository.
name: Publish app

on:
  workflow_call:
    inputs:
      plan:
        description: dist's plan of the release
        type: string
        required: true

permissions: {}

jobs:
  publish-cask:
    # Like dist's formula: a prerelease does not reach the tap.
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease || fromJson(inputs.plan).publish_prereleases }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cask
          path: cask
      - uses: actions/checkout@v6
        with:
          repository: oberbichler/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Commit the cask
        env:
          PLAN: ${{ inputs.plan }}
        run: |
          version=$(jq -r .announcement_tag <<<"$PLAN")
          grep -qx "  version \"${version#v}\"" cask/dinocopy.rb

          mkdir -p tap/Casks
          cp cask/dinocopy.rb tap/Casks/dinocopy.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dinocopy.rb
          git commit -m "dinocopy ${version#v}"
          # Someone else may have pushed to the tap meanwhile.
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
