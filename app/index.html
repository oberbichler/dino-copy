<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>dino-copy</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <!-- 1 · Choose source and target, then Start -->
    <section id="setup" class="view">
      <div class="pair">
        <label class="pair-label" for="pick-source">Source</label>
        <button id="pick-source" class="picker" type="button">
          <span class="picker-icon" aria-hidden="true"></span>
          <span class="picker-text">
            <span class="picker-name">Choose source…</span>
            <span class="picker-sub"></span>
          </span>
          <span class="picker-chevron" aria-hidden="true">⌄</span>
        </button>

        <label class="pair-label" for="pick-target">Target</label>
        <button id="pick-target" class="picker" type="button">
          <span class="picker-icon" aria-hidden="true"></span>
          <span class="picker-text">
            <span class="picker-name">Choose target…</span>
            <span class="picker-sub"></span>
          </span>
          <span class="picker-chevron" aria-hidden="true">⌄</span>
        </button>
      </div>

      <footer class="setup-footer">
        <p id="setup-hint" class="hint"></p>
        <div class="split-button">
          <button id="start" class="primary split-main" type="button" disabled>Mirror</button>
          <button id="start-menu" class="primary split-arrow" type="button" aria-label="Choose what Start does">
            <span aria-hidden="true">⌄</span>
          </button>
        </div>
      </footer>
    </section>

    <!-- 2 · Running: progress and time left -->
    <section id="running" class="view" hidden>
      <p id="run-route" class="route"></p>
      <p id="run-phase" class="phase">Comparing source and target…</p>
      <p id="run-eta" class="eta">&nbsp;</p>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="run-bar" class="bar-fill indeterminate"></div>
      </div>
      <div class="run-stats">
        <span id="run-bytes"></span>
        <span id="run-rate"></span>
      </div>
      <p id="run-files" class="muted"></p>
      <p id="run-current" class="current muted"></p>
      <footer class="run-footer">
        <button id="cancel" type="button">Cancel</button>
      </footer>
    </section>

    <!-- 3 · Finished -->
    <section id="done" class="view" hidden>
      <div class="done-head">
        <span id="done-icon" class="done-icon" aria-hidden="true"></span>
        <div>
          <p id="done-headline" class="headline"></p>
          <p id="done-summary" class="muted"></p>
        </div>
      </div>
      <ul id="done-messages" class="messages"></ul>
      <footer class="done-footer">
        <button id="done-ok" class="primary" type="button">Done</button>
      </footer>
    </section>

    <!-- 4 · Scan result -->
    <section id="scan" class="view" hidden>
      <header class="scan-head">
        <p id="scan-route" class="route"></p>
        <p id="scan-summary" class="headline"></p>
        <p id="scan-note" class="muted"></p>
      </header>
      <div class="scan-tools">
        <div class="chips" role="group" aria-label="Show">
          <button class="chip on" data-cat="copy" type="button"><span class="sign copy">＋</span> Copy <b id="count-copy">0</b></button>
          <button class="chip on" data-cat="delete" type="button"><span class="sign delete">−</span> Delete <b id="count-delete">0</b></button>
          <button class="chip on" data-cat="rename" type="button"><span class="sign rename">↻</span> Rename <b id="count-rename">0</b></button>
        </div>
        <input id="scan-search" class="search" type="search" placeholder="Search name or path" spellcheck="false" autocomplete="off" />
        <div class="segmented" role="group" aria-label="View">
          <button id="view-tree" class="on" type="button">Tree</button>
          <button id="view-list" type="button">List</button>
        </div>
      </div>
      <div id="scan-rows" class="rows" tabindex="0">
        <div id="scan-spacer" class="rows-spacer"></div>
      </div>
      <footer class="scan-footer">
        <span id="scan-shown" class="muted"></span>
        <span class="spacer"></span>
        <button id="scan-close" type="button">Close</button>
        <button id="scan-mirror" class="primary" type="button">Mirror now</button>
      </footer>
    </section>
  </body>
</html>
