[package]
name = "dino-copy-app"
version = "0.2.1"
description = "Desktop app for dino-copy: mirror one disk onto another"
license = "ISC"
repository = "https://github.com/oberbichler/dino-copy"
edition = "2024"
rust-version = "1.88"
publish = false

# Its own workspace with its own lockfile: the app's (many) dependencies must
# never shift the versions or the minimum Rust version of the command line tool.
[workspace]

[lib]
name = "dino_copy_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
dino-copy-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
sysinfo = { version = "0.40.1", default-features = false, features = ["disk"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"
